<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D Plane Game</title>

<style>
body{
margin:0;
overflow:hidden;
background:#87CEEB;
touch-action:none;
font-family:sans-serif;
}

#controls{
position:fixed;
bottom:20px;
left:20px;
display:grid;
grid-template-columns:70px 70px 70px;
grid-template-rows:70px 70px;
gap:8px;
user-select:none;
}

.btn{
background:rgba(255,255,255,.45);
border:2px solid white;
border-radius:15px;
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
color:white;
backdrop-filter:blur(4px);
}

.btn:active{
background:white;
color:black;
}
</style>
</head>
<body>

<div id="controls">
<div></div>
<div class="btn" id="up">▲</div>
<div></div>

<div class="btn" id="left">◀</div>
<div class="btn" id="down">▼</div>
<div class="btn" id="right">▶</div>
</div>

<script type="module">

import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.170/build/three.module.js";

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);

const camera=new THREE.PerspectiveCamera(
70,
window.innerWidth/window.innerHeight,
0.1,
1000
);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
document.body.appendChild(renderer.domElement);

const light=new THREE.DirectionalLight(0xffffff,2);
light.position.set(5,10,5);
scene.add(light);

scene.add(new THREE.AmbientLight(0xffffff,1));

// Ground

const ground=new THREE.Mesh(
new THREE.PlaneGeometry(5000,5000),
new THREE.MeshLambertMaterial({color:0x4CAF50})
);

ground.rotation.x=-Math.PI/2;
ground.position.y=-10;
scene.add(ground);

// Plane

const plane=new THREE.Group();

const body=new THREE.Mesh(
new THREE.BoxGeometry(1.6,.4,.4),
new THREE.MeshLambertMaterial({color:0xff4444})
);

plane.add(body);

const wing=new THREE.Mesh(
new THREE.BoxGeometry(.5,.05,2),
new THREE.MeshLambertMaterial({color:0xffffff})
);

plane.add(wing);

const tail=new THREE.Mesh(
new THREE.BoxGeometry(.4,.3,.05),
new THREE.MeshLambertMaterial({color:0xffffff})
);

tail.position.set(-0.7,0.25,0);
plane.add(tail);

scene.add(plane);

plane.position.y=5;

camera.position.set(0,3,8);

// Clouds

const clouds=[];

for(let i=0;i<40;i++){

const c=new THREE.Mesh(
new THREE.SphereGeometry(1.3,10,10),
new THREE.MeshLambertMaterial({color:0xffffff})
);

c.position.set(
(Math.random()-0.5)*120,
Math.random()*30+3,
-Math.random()*300
);

scene.add(c);
clouds.push(c);

}

const keys={
left:false,
right:false,
up:false,
down:false
};

window.addEventListener("keydown",e=>{
if(e.key=="ArrowLeft")keys.left=true;
if(e.key=="ArrowRight")keys.right=true;
if(e.key=="ArrowUp")keys.up=true;
if(e.key=="ArrowDown")keys.down=true;
});

window.addEventListener("keyup",e=>{
if(e.key=="ArrowLeft")keys.left=false;
if(e.key=="ArrowRight")keys.right=false;
if(e.key=="ArrowUp")keys.up=false;
if(e.key=="ArrowDown")keys.down=false;
});

function bind(id,key){

const b=document.getElementById(id);

b.addEventListener("touchstart",e=>{
e.preventDefault();
keys[key]=true;
});

b.addEventListener("touchend",()=>{
keys[key]=false;
});

b.addEventListener("mousedown",()=>{
keys[key]=true;
});

b.addEventListener("mouseup",()=>{
keys[key]=false;
});

b.addEventListener("mouseleave",()=>{
keys[key]=false;
});

}

bind("left","left");
bind("right","right");
bind("up","up");
bind("down","down");

function animate(){

requestAnimationFrame(animate);

// Controls

if(keys.left){
plane.rotation.z+=0.03;
plane.position.x-=0.12;
}

if(keys.right){
plane.rotation.z-=0.03;
plane.position.x+=0.12;
}

if(keys.up){
plane.position.y+=0.12;
plane.rotation.x=-0.2;
}

if(keys.down){
plane.position.y-=0.12;
plane.rotation.x=0.2;
}

plane.rotation.z*=0.92;
plane.rotation.x*=0.92;

// Forward

plane.position.z-=0.6;

// Camera follow

camera.position.lerp(
new THREE.Vector3(
plane.position.x,
plane.position.y+2,
plane.position.z+8
),
0.08
);

camera.lookAt(
plane.position.x,
plane.position.y,
plane.position.z-10
);

// Recycle clouds

for(const c of clouds){

if(c.position.z>plane.position.z+30){

c.position.z=plane.position.z-300-Math.random()*200;
c.position.x=(Math.random()-0.5)*120;
c.position.y=Math.random()*30+5;

}

}

renderer.render(scene,camera);

}

animate();

window.addEventListener("resize",()=>{

camera.aspect=window.innerWidth/window.innerHeight;
camera.updateProjectionMatrix();

renderer.setSize(window.innerWidth,window.innerHeight);

});

</script>

</body>
</html>
