<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Sky Pilot</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            background-color: #111;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
            pointer-events: none;
            z-index: 10;
        }
        .stat-box {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .stat-value {
            color: #38bdf8;
        }
        #controls-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.9);
            background: rgba(15, 23, 42, 0.7);
            padding: 10px 22px;
            border-radius: 20px;
            font-size: 14px;
            pointer-events: none;
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 23, 42, 0.92);
            border: 2px solid #38bdf8;
            padding: 30px 50px;
            border-radius: 16px;
            color: white;
            text-align: center;
            display: none;
            z-index: 20;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        #game-over h1 {
            margin-top: 0;
            font-size: 34px;
        }
        #restart-btn {
            margin-top: 18px;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: bold;
            background: linear-gradient(135deg, #38bdf8, #2563eb);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }
        #restart-btn:hover {
            transform: scale(1.05);
            background: linear-gradient(135deg, #0284c7, #1d4ed8);
        }
    </style>
    <!-- Lightweight Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="ui">
        <div class="stat-box">SCORE: <span id="score-val" class="stat-value">0</span></div>
        <div class="stat-box">CHECKPOINTS: <span id="rings-val" class="stat-value">12</span></div>
        <div class="stat-box">AIRSPEED: <span id="speed-val" class="stat-value">0</span> km/h</div>
    </div>

    <div id="controls-hint">
        🎮 Move Mouse to Pitch & Roll | Hold Space or Left-Click for Turbo Boost
    </div>

    <div id="game-over">
        <h1 id="over-title">GAME OVER</h1>
        <p id="over-desc">You crashed into the ocean!</p>
        <p>Final Score: <span id="final-score" style="color: #38bdf8; font-weight: bold;">0</span></p>
        <button id="restart-btn" onclick="resetGame()">PLAY AGAIN</button>
    </div>

    <script>
        // --- 1. Scene, Camera & Renderer Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x7dd3fc);
        scene.fog = new THREE.FogExp2(0x7dd3fc, 0.0012);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // --- 2. Lighting ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.85);
        dirLight.position.set(100, 300, 100);
        dirLight.castShadow = true;
        dirLight.shadow.camera.top = 500;
        dirLight.shadow.camera.bottom = -500;
        dirLight.shadow.camera.left = -500;
        dirLight.shadow.camera.right = 500;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        // --- 3. Ocean Surface ---
        const oceanGeo = new THREE.PlaneGeometry(10000, 10000, 32, 32);
        const oceanMat = new THREE.MeshPhongMaterial({
            color: 0x0284c7,
            shininess: 70,
            transparent: true,
            opacity: 0.9,
            flatShading: true
        });
        const ocean = new THREE.Mesh(oceanGeo, oceanMat);
        ocean.rotation.x = -Math.PI / 2;
        ocean.position.y = 0;
        scene.add(ocean);

        // --- 4. Low-Poly Airplane Builder ---
        function createAirplane() {
            const planeGroup = new THREE.Group();

            // Main Fuselage Body
            const bodyGeo = new THREE.ConeGeometry(1.2, 8, 8);
            const bodyMat = new THREE.MeshPhongMaterial({ color: 0xef4444, flatShading: true });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.rotation.x = Math.PI / 2;
            body.castShadow = true;
            planeGroup.add(body);

            // Cockpit Canopy
            const glassGeo = new THREE.BoxGeometry(0.9, 1.1, 1.8);
            const glassMat = new THREE.MeshPhongMaterial({ color: 0xe0f2fe, transparent: true, opacity: 0.75 });
            const glass = new THREE.Mesh(glassGeo, glassMat);
            glass.position.set(0, 0.6, 0.5);
            planeGroup.add(glass);

            // Wings
            const wingGeo = new THREE.BoxGeometry(9.5, 0.12, 1.8);
            const wingMat = new THREE.MeshPhongMaterial({ color: 0xf8fafc, flatShading: true });
            const wings = new THREE.Mesh(wingGeo, wingMat);
            wings.position.set(0, 0, 0.5);
            wings.castShadow = true;
            planeGroup.add(wings);

            // Tail Stabilizers
            const tailGeo = new THREE.BoxGeometry(0.15, 1.8, 1.2);
            const tailMat = new THREE.MeshPhongMaterial({ color: 0xef4444, flatShading: true });
            const tail = new THREE.Mesh(tailGeo, tailMat);
            tail.position.set(0, 1, -3.2);
            tail.castShadow = true;
            planeGroup.add(tail);

            const tailWingGeo = new THREE.BoxGeometry(3.2, 0.1, 1);
            const tailWings = new THREE.Mesh(tailWingGeo, wingMat);
            tailWings.position.set(0, 0.2, -3.2);
            planeGroup.add(tailWings);

            // Propeller
            const propGroup = new THREE.Group();
            const propMat = new THREE.MeshPhongMaterial({ color: 0x1e293b });
            const bladeGeo = new THREE.BoxGeometry(0.25, 2.4, 0.05);
            const blade1 = new THREE.Mesh(bladeGeo, propMat);
            const blade2 = new THREE.Mesh(bladeGeo, propMat);
            blade2.rotation.z = Math.PI / 2;
            propGroup.add(blade1, blade2);
            propGroup.position.set(0, 0, 4.05);
            planeGroup.add(propGroup);

            planeGroup.propeller = propGroup;
            return planeGroup;
        }

        const player = createAirplane();
        player.position.set(0, 45, 0);
        scene.add(player);

        // --- 5. Clouds Environment ---
        function createClouds() {
            const cloudMat = new THREE.MeshPhongMaterial({ color: 0xffffff, flatShading: true, transparent: true, opacity: 0.85 });
            for (let i = 0; i < 120; i++) {
                const cloud = new THREE.Group();
                const puffs = 3 + Math.floor(Math.random() * 4);
                for (let j = 0; j < puffs; j++) {
                    const puff = new THREE.Mesh(new THREE.DodecahedronGeometry(8 + Math.random() * 10), cloudMat);
                    puff.position.set((Math.random() - 0.5) * 18, (Math.random() - 0.5) * 6, (Math.random() - 0.5) * 18);
                    cloud.add(puff);
                }
                cloud.position.set((Math.random() - 0.5) * 2400, 60 + Math.random() * 180, (Math.random() - 0.5) * 2400);
                scene.add(cloud);
            }
        }
        createClouds();

        // --- 6. Ring Checkpoints ---
        const rings = [];
        let score = 0;
        const totalRings = 12;

        function spawnRings() {
            rings.forEach(r => scene.remove(r.mesh));
            rings.length = 0;

            let prevPos = new THREE.Vector3(0, 45, 80);

            for (let i = 0; i < totalRings; i++) {
                const ringGeo = new THREE.TorusGeometry(8, 0.7, 12, 28);
                const ringMat = new THREE.MeshPhongMaterial({ color: 0xfacc15, emissive: 0xca8a04, emissiveIntensity: 0.4, flatShading: true });
                const ringMesh = new THREE.Mesh(ringGeo, ringMat);

                const nextPos = new THREE.Vector3(
                    prevPos.x + (Math.random() - 0.5) * 320,
                    Math.max(20, prevPos.y + (Math.random() - 0.5) * 80),
                    prevPos.z + 180 + Math.random() * 120
                );

                ringMesh.position.copy(nextPos);
                ringMesh.lookAt(prevPos);
                scene.add(ringMesh);

                rings.push({ mesh: ringMesh, collected: false });
                prevPos = nextPos;
            }
            document.getElementById('rings-val').innerText = totalRings;
        }

        // --- 7. Controls & Input Handling ---
        let mouseX = 0, mouseY = 0;
        let isBoosting = false;
        let isGameOver = false;

        let baseSpeed = 1.1;
        let currentSpeed = baseSpeed;

        window.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth) * 2 - 1;
            mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
        });

        window.addEventListener('mousedown', () => isBoosting = true);
        window.addEventListener('mouseup', () => isBoosting = false);
        window.addEventListener('keydown', (e) => { if (e.code === 'Space') isBoosting = true; });
        window.addEventListener('keyup', (e) => { if (e.code === 'Space') isBoosting = false; });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- 8. Main Loop ---
        function animate() {
            if (isGameOver) return;
            requestAnimationFrame(animate);

            // Speed Smooth Interpolation
            const targetSpeed = isBoosting ? 2.6 : baseSpeed;
            currentSpeed += (targetSpeed - currentSpeed) * 0.05;

            // Aircraft Steering Physics
            const targetRotX = mouseY * 0.85;
            const targetRotZ = -mouseX * 1.25;
            const targetRotY = player.rotation.y - mouseX * 0.022;

            player.rotation.x += (targetRotX - player.rotation.x) * 0.08;
            player.rotation.z += (targetRotZ - player.rotation.z) * 0.08;
            player.rotation.y = targetRotY;

            player.translateZ(currentSpeed);
            player.propeller.rotation.z += currentSpeed * 0.85;

            // Camera Follow Rig
            const offset = new THREE.Vector3(0, 5.5, -16).applyMatrix4(player.matrixWorld);
            camera.position.x += (offset.x - camera.position.x) * 0.1;
            camera.position.y += (offset.y - camera.position.y) * 0.1;
            camera.position.z += (offset.z - camera.position.z) * 0.1;

            const lookTarget = player.position.clone().add(new THREE.Vector3(0, 1.5, 20).applyQuaternion(player.quaternion));
            camera.lookAt(lookTarget);

            // Checkpoint Collisions
            rings.forEach(ring => {
                if (!ring.collected && player.position.distanceTo(ring.mesh.position) < 11) {
                    ring.collected = true;
                    ring.mesh.scale.set(0.01, 0.01, 0.01);
                    score += 150;
                    document.getElementById('score-val').innerText = score;

                    const left = rings.filter(r => !r.collected).length;
                    document.getElementById('rings-val').innerText = left;

                    if (left === 0) endGame(true);
                } else if (!ring.collected) {
                    ring.mesh.rotation.z += 0.02;
                }
            });

            // Update UI
            document.getElementById('speed-val').innerText = Math.round(currentSpeed * 110);

            // Ocean Crash Check
            if (player.position.y <= 1.5) endGame(false);

            renderer.render(scene, camera);
        }

        function endGame(won) {
            isGameOver = true;
            const modal = document.getElementById('game-over');
            const title = document.getElementById('over-title');
            const desc = document.getElementById('over-desc');

            if (won) {
                title.innerText = "MISSION COMPLETED!";
                title.style.color = "#34d399";
                desc.innerText = "You flew through all ring checkpoints perfectly!";
            } else {
                title.innerText = "CRASH LANDING!";
                title.style.color = "#f43f5e";
                desc.innerText = "You crashed straight into the sea!";
            }

            document.getElementById('final-score').innerText = score;
            modal.style.display = 'block';
        }

        function resetGame() {
            document.getElementById('game-over').style.display = 'none';
            player.position.set(0, 45, 0);
            player.rotation.set(0, 0, 0);
            camera.position.set(0, 50, -16);
            score = 0;
            document.getElementById('score-val').innerText = score;
            isGameOver = false;
            spawnRings();
            animate();
        }

        // Initialize Game
        spawnRings();
        animate();
    </script>
</body>
</html>
