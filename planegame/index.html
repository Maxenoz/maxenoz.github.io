<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Sky Pilot - Island Airstrip Edition</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            background-color: #000;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
            z-index: 10;
        }
        .stat-box {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(15, 23, 42, 0.7);
            padding: 8px 16px;
            border-radius: 12px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .stat-value {
            color: #38bdf8;
        }
        #runway-hud {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #fff;
            background: rgba(15, 23, 42, 0.7);
            padding: 12px 20px;
            border-radius: 12px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(56, 189, 248, 0.4);
            font-size: 15px;
            font-weight: bold;
            text-align: right;
            pointer-events: none;
            z-index: 10;
        }
        #controls-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.95);
            background: rgba(15, 23, 42, 0.75);
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            pointer-events: none;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 14px;
            height: 14px;
            transform: translate(-50%, -50%);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            pointer-events: none;
            z-index: 5;
        }
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 23, 42, 0.95);
            border: 2px solid #38bdf8;
            padding: 30px 50px;
            border-radius: 16px;
            color: white;
            text-align: center;
            display: none;
            z-index: 20;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }
        #game-over h1 {
            margin-top: 0;
            font-size: 34px;
        }
        #restart-btn {
            margin-top: 18px;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: bold;
            background: linear-gradient(135deg, #38bdf8, #2563eb);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }
        #restart-btn:hover {
            transform: scale(1.05);
            background: linear-gradient(135deg, #0284c7, #1d4ed8);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>
    <div id="crosshair"></div>

    <div id="ui">
        <div class="stat-box">SCORE: <span id="score-val" class="stat-value">0</span></div>
        <div class="stat-box">RINGS: <span id="rings-val" class="stat-value">0 / 10</span></div>
        <div class="stat-box">ALTITUDE: <span id="alt-val" class="stat-value">0</span> m</div>
        <div class="stat-box">AIRSPEED: <span id="speed-val" class="stat-value">0</span> km/h</div>
    </div>

    <div id="runway-hud">
        🛬 RUNWAY DISTANCE: <span id="runway-dist" style="color: #facc15;">0</span> m<br>
        <span id="runway-status" style="font-size: 12px; color: #94a3b8; font-weight: normal;">Collect rings or head straight to land!</span>
    </div>

    <div id="controls-hint">
        <b>Mouse:</b> Pitch & Roll Control &nbsp;|&nbsp; <b>W / S:</b> Increase/Reduce Throttle &nbsp;|&nbsp; <b>Space:</b> Boost
    </div>

    <div id="game-over">
        <h1 id="over-title">GAME OVER</h1>
        <p id="over-desc">You crashed!</p>
        <p>Final Score: <span id="final-score" style="color: #38bdf8; font-weight: bold;">0</span></p>
        <button id="restart-btn" onclick="resetGame()">FLY AGAIN</button>
    </div>

    <script>
        // --- 1. Scene & Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x38bdf8);
        scene.fog = new THREE.FogExp2(0x38bdf8, 0.00035);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 5000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // --- Lighting ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xfffaed, 0.95);
        sunLight.position.set(400, 700, 300);
        sunLight.castShadow = true;
        sunLight.shadow.camera.top = 1200;
        sunLight.shadow.camera.bottom = -1200;
        sunLight.shadow.camera.left = -1200;
        sunLight.shadow.camera.right = 1200;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        scene.add(sunLight);

        // --- 2. Runway & Island Parameters ---
        const RUNWAY_POS = new THREE.Vector3(0, 12, 2400);
        const RUNWAY_WIDTH = 55;
        const RUNWAY_LENGTH = 650;
        const RUNWAY_ALT = 12;

        function getRawTerrainNoise(x, z) {
            let n1 = Math.sin(x * 0.0012) * Math.cos(z * 0.0012) * 190;
            let n2 = Math.sin(x * 0.0035) * Math.sin(z * 0.0035) * 60;
            let n3 = Math.cos(x * 0.01) * Math.sin(z * 0.01) * 15;
            return n1 + n2 + n3 - 25;
        }

        function getTerrainHeightAt(x, z) {
            // Flatten region for Island Runway
            const dx = Math.abs(x - RUNWAY_POS.x);
            const dz = Math.abs(z - RUNWAY_POS.z);
            if (dx < RUNWAY_WIDTH * 2.2 && dz < RUNWAY_LENGTH * 0.75) {
                const distFactor = Math.max(dx / (RUNWAY_WIDTH * 2.2), dz / (RUNWAY_LENGTH * 0.75));
                const rawH = getRawTerrainNoise(x, z);
                return THREE.MathUtils.lerp(RUNWAY_ALT, Math.max(0, rawH), Math.pow(distFactor, 2));
            }
            return Math.max(0, getRawTerrainNoise(x, z));
        }

        // --- 3. Terrain Mesh Generation ---
        const terrainWorldSize = 6500;
        const terrainSegments = 130;
        const terrainGeo = new THREE.PlaneGeometry(terrainWorldSize, terrainWorldSize, terrainSegments, terrainSegments);
        terrainGeo.rotateX(-Math.PI / 2);

        const posAttr = terrainGeo.attributes.position;
        const vertex = new THREE.Vector3();

        for (let i = 0; i < posAttr.count; i++) {
            vertex.fromBufferAttribute(posAttr, i);
            const height = getTerrainHeightAt(vertex.x, vertex.z);
            posAttr.setY(i, height);
        }
        terrainGeo.computeVertexNormals();

        // Vertex Coloring
        const colors = [];
        const colorSand = new THREE.Color(0xd97706);
        const colorGrass = new THREE.Color(0x15803d);
        const colorRock = new THREE.Color(0x475569);
        const colorSnow = new THREE.Color(0xf8fafc);

        for (let i = 0; i < posAttr.count; i++) {
            let h = posAttr.getY(i);
            let c = new THREE.Color();
            if (h < 5) c.copy(colorSand);
            else if (h < 95) c.lerpColors(colorGrass, colorRock, (h - 5) / 90);
            else c.lerpColors(colorRock, colorSnow, Math.min(1, (h - 95) / 80));
            colors.push(c.r, c.g, c.b);
        }
        terrainGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

        const terrainMat = new THREE.MeshPhongMaterial({ vertexColors: true, flatShading: true, shininess: 5 });
        const terrain = new THREE.Mesh(terrainGeo, terrainMat);
        terrain.receiveShadow = true;
        scene.add(terrain);

        // Ocean
        const oceanGeo = new THREE.PlaneGeometry(terrainWorldSize, terrainWorldSize);
        const oceanMat = new THREE.MeshPhongMaterial({ color: 0x0284c7, shininess: 90, transparent: true, opacity: 0.82, flatShading: true });
        const ocean = new THREE.Mesh(oceanGeo, oceanMat);
        ocean.rotation.x = -Math.PI / 2;
        ocean.position.y = 0;
        scene.add(ocean);

        // --- 4. Runway Structure & Airport Decor ---
        function createRunway() {
            const runwayGroup = new THREE.Group();

            // Tarmac Surface
            const tarmacGeo = new THREE.BoxGeometry(RUNWAY_WIDTH, 0.4, RUNWAY_LENGTH);
            const tarmacMat = new THREE.MeshPhongMaterial({ color: 0x1e293b, flatShading: true });
            const tarmac = new THREE.Mesh(tarmacGeo, tarmacMat);
            tarmac.position.set(0, RUNWAY_ALT + 0.2, 0);
            tarmac.receiveShadow = true;
            runwayGroup.add(tarmac);

            // Centerline Dashes
            const dashMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            for (let z = -RUNWAY_LENGTH / 2 + 30; z < RUNWAY_LENGTH / 2 - 30; z += 40) {
                const dashGeo = new THREE.BoxGeometry(2.5, 0.1, 18);
                const dash = new THREE.Mesh(dashGeo, dashMat);
                dash.position.set(0, RUNWAY_ALT + 0.45, z);
                runwayGroup.add(dash);
            }

            // Threshold Stripes
            for (let i = -4; i <= 4; i++) {
                if (i === 0) continue;
                const stripeGeo = new THREE.BoxGeometry(3, 0.1, 30);
                const startStripe = new THREE.Mesh(stripeGeo, dashMat);
                startStripe.position.set(i * 5, RUNWAY_ALT + 0.45, -RUNWAY_LENGTH / 2 + 25);
                const endStripe = new THREE.Mesh(stripeGeo, dashMat);
                endStripe.position.set(i * 5, RUNWAY_ALT + 0.45, RUNWAY_LENGTH / 2 - 25);
                runwayGroup.add(startStripe, endStripe);
            }

            // Runway Edge Lights
            const redMat = new THREE.MeshBasicMaterial({ color: 0xef4444 });
            const greenMat = new THREE.MeshBasicMaterial({ color: 0x22c55e });
            const yellowMat = new THREE.MeshBasicMaterial({ color: 0xfacc15 });

            for (let z = -RUNWAY_LENGTH / 2; z <= RUNWAY_LENGTH / 2; z += 35) {
                const lLight = new THREE.Mesh(new THREE.SphereGeometry(0.8, 8, 8), yellowMat);
                lLight.position.set(-RUNWAY_WIDTH / 2 - 1.5, RUNWAY_ALT + 0.8, z);
                const rLight = new THREE.Mesh(new THREE.SphereGeometry(0.8, 8, 8), yellowMat);
                rLight.position.set(RUNWAY_WIDTH / 2 + 1.5, RUNWAY_ALT + 0.8, z);
                runwayGroup.add(lLight, rLight);
            }

            // Approach & End Lights
            for (let x = -RUNWAY_WIDTH / 2; x <= RUNWAY_WIDTH / 2; x += 8) {
                const appLight = new THREE.Mesh(new THREE.SphereGeometry(1.0, 8, 8), greenMat);
                appLight.position.set(x, RUNWAY_ALT + 0.8, -RUNWAY_LENGTH / 2);
                const endLight = new THREE.Mesh(new THREE.SphereGeometry(1.0, 8, 8), redMat);
                endLight.position.set(x, RUNWAY_ALT + 0.8, RUNWAY_LENGTH / 2);
                runwayGroup.add(appLight, endLight);
            }

            // Control Tower
            const towerGroup = new THREE.Group();
            const towerBase = new THREE.Mesh(new THREE.CylinderGeometry(4, 6, 35, 8), new THREE.MeshPhongMaterial({ color: 0x94a3b8 }));
            towerBase.position.y = 17.5;
            const towerTop = new THREE.Mesh(new THREE.CylinderGeometry(8, 6, 8, 8), new THREE.MeshPhongMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.7 }));
            towerTop.position.y = 37;
            const towerRoof = new THREE.Mesh(new THREE.ConeGeometry(9, 5, 8), new THREE.MeshPhongMaterial({ color: 0x0f172a }));
            towerRoof.position.y = 42.5;
            towerGroup.add(towerBase, towerTop, towerRoof);
            towerGroup.position.set(RUNWAY_WIDTH / 2 + 35, RUNWAY_ALT, -100);
            runwayGroup.add(towerGroup);

            // Rotating Airport Beacon Light
            const beaconMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
            const beaconMesh = new THREE.Mesh(new THREE.SphereGeometry(1.5, 8, 8), beaconMat);
            beaconMesh.position.set(RUNWAY_WIDTH / 2 + 35, RUNWAY_ALT + 44, -100);
            runwayGroup.add(beaconMesh);

            runwayGroup.position.copy(RUNWAY_POS);
            return runwayGroup;
        }

        scene.add(createRunway());

        // --- 5. Airplane Builder ---
        function createAirplane() {
            const planeGroup = new THREE.Group();

            // Fuselage
            const body = new THREE.Mesh(
                new THREE.ConeGeometry(1.4, 9, 8),
                new THREE.MeshPhongMaterial({ color: 0xd97706, flatShading: true })
            );
            body.rotation.x = Math.PI / 2;
            body.castShadow = true;
            planeGroup.add(body);

            // Cockpit Glass
            const glass = new THREE.Mesh(
                new THREE.BoxGeometry(1.0, 1.2, 2.0),
                new THREE.MeshPhongMaterial({ color: 0xe0f2fe, transparent: true, opacity: 0.8 })
            );
            glass.position.set(0, 0.7, 0.6);
            planeGroup.add(glass);

            // Main Wings
            const wings = new THREE.Mesh(
                new THREE.BoxGeometry(11, 0.15, 2.0),
                new THREE.MeshPhongMaterial({ color: 0xf8fafc, flatShading: true })
            );
            wings.position.set(0, 0.1, 0.6);
            wings.castShadow = true;
            planeGroup.add(wings);

            // Tail Fin
            const tail = new THREE.Mesh(
                new THREE.BoxGeometry(0.18, 2.2, 1.4),
                new THREE.MeshPhongMaterial({ color: 0xd97706, flatShading: true })
            );
            tail.position.set(0, 1.2, -3.6);
            tail.castShadow = true;
            planeGroup.add(tail);

            const tailWings = new THREE.Mesh(
                new THREE.BoxGeometry(3.6, 0.12, 1.2),
                new THREE.MeshPhongMaterial({ color: 0xf8fafc, flatShading: true })
            );
            tailWings.position.set(0, 0.3, -3.6);
            planeGroup.add(tailWings);

            // Landing Gear Wheels
            const wheelMat = new THREE.MeshPhongMaterial({ color: 0x0f172a });
            const wheelGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.3, 12);
            wheelGeo.rotateZ(Math.PI / 2);

            const leftWheel = new THREE.Mesh(wheelGeo, wheelMat);
            leftWheel.position.set(-1.8, -1.2, 0.5);
            const rightWheel = new THREE.Mesh(wheelGeo, wheelMat);
            rightWheel.position.set(1.8, -1.2, 0.5);
            const backWheel = new THREE.Mesh(wheelGeo, wheelMat);
            backWheel.position.set(0, -0.8, -3.2);

            planeGroup.add(leftWheel, rightWheel, backWheel);

            // Propeller
            const propGroup = new THREE.Group();
            const propMat = new THREE.MeshPhongMaterial({ color: 0x1e293b });
            const bladeGeo = new THREE.BoxGeometry(0.3, 2.8, 0.08);
            const blade1 = new THREE.Mesh(bladeGeo, propMat);
            const blade2 = new THREE.Mesh(bladeGeo, propMat);
            blade2.rotation.z = Math.PI / 2;
            propGroup.add(blade1, blade2);
            propGroup.position.set(0, 0, 4.5);
            planeGroup.add(propGroup);

            planeGroup.propeller = propGroup;
            return planeGroup;
        }

        const player = createAirplane();
        player.position.set(0, 140, 0);
        scene.add(player);

        // --- 6. Ring Checkpoints ---
        const rings = [];
        let score = 0;
        const totalRings = 10;

        function spawnRings() {
            rings.forEach(r => scene.remove(r.mesh));
            rings.length = 0;

            // Align rings toward runway approach
            for (let i = 0; i < totalRings; i++) {
                const ringGeo = new THREE.TorusGeometry(12, 1.0, 12, 28);
                const ringMat = new THREE.MeshPhongMaterial({ color: 0xfacc15, emissive: 0xca8a04, emissiveIntensity: 0.5, flatShading: true });
                const ringMesh = new THREE.Mesh(ringGeo, ringMat);

                const t = (i + 1) / totalRings;
                const pos = new THREE.Vector3(
                    Math.sin(i * 0.8) * 200,
                    140 - t * 80,
                    200 + i * 190
                );

                ringMesh.position.copy(pos);
                ringMesh.rotation.y = Math.PI;
                scene.add(ringMesh);

                rings.push({ mesh: ringMesh, collected: false });
            }
            document.getElementById('rings-val').innerText = `0 / ${totalRings}`;
        }

        // --- 7. Controls & Flight Variables ---
        let targetMouseX = 0, targetMouseY = 0;
        let smoothMouseX = 0, smoothMouseY = 0;

        let throttle = 1.2;
        let currentSpeed = throttle;
        let isBoosting = false;
        let isGameOver = false;
        let isLanded = false;

        window.addEventListener('mousemove', (e) => {
            targetMouseX = (e.clientX - window.innerWidth / 2) / (window.innerWidth / 2);
            targetMouseY = (e.clientY - window.innerHeight / 2) / (window.innerHeight / 2);
        });

        window.addEventListener('keydown', (e) => {
            if (isLanded || isGameOver) return;
            if (e.code === 'KeyW') throttle = Math.min(throttle + 0.2, 2.5);
            if (e.code === 'KeyS') throttle = Math.max(throttle - 0.2, 0.4);
            if (e.code === 'Space') isBoosting = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'Space') isBoosting = false;
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- 8. Animation & Landing Mechanics Loop ---
        function animate() {
            if (isGameOver) return;
            requestAnimationFrame(animate);

            if (!isLanded) {
                // Smooth Mouse Steering Controls
                smoothMouseX += (targetMouseX - smoothMouseX) * 0.05;
                smoothMouseY += (targetMouseY - smoothMouseY) * 0.05;

                const targetSpeed = isBoosting ? 3.5 : throttle;
                currentSpeed += (targetSpeed - currentSpeed) * 0.05;

                const pitchRate = -smoothMouseY * 0.025;
                const yawRate = -smoothMouseX * 0.018;
                const rollTarget = -smoothMouseX * 1.1;

                player.rotateX(pitchRate);
                player.rotateY(yawRate);

                // Auto Roll-Leveling
                player.rotation.z += (rollTarget - player.rotation.z) * 0.1;
                player.translateZ(currentSpeed);
            } else {
                // Ground Roll Deceleration
                currentSpeed += (0 - currentSpeed) * 0.04;
                player.translateZ(currentSpeed);
                player.rotation.x = 0;
                player.rotation.z = 0;

                if (currentSpeed < 0.05 && !isGameOver) {
                    endGame(true, "PERFECT LANDING!");
                }
            }

            player.propeller.rotation.z += currentSpeed * 0.85;

            // Smooth Camera Follow
            const cameraOffset = new THREE.Vector3(0, 6.5, -22).applyMatrix4(player.matrixWorld);
            camera.position.x += (cameraOffset.x - camera.position.x) * 0.08;
            camera.position.y += (cameraOffset.y - camera.position.y) * 0.08;
            camera.position.z += (cameraOffset.z - camera.position.z) * 0.08;

            const lookAtTarget = player.position.clone().add(new THREE.Vector3(0, 1.5, 30).applyQuaternion(player.quaternion));
            camera.lookAt(lookAtTarget);

            // Check Ring Collisions
            rings.forEach(ring => {
                if (!ring.collected && player.position.distanceTo(ring.mesh.position) < 16) {
                    ring.collected = true;
                    ring.mesh.scale.set(0.01, 0.01, 0.01);
                    score += 250;
                    document.getElementById('score-val').innerText = score;

                    const collectedCount = rings.filter(r => r.collected).length;
                    document.getElementById('rings-val').innerText = `${collectedCount} / ${totalRings}`;
                }
            });

            // HUD Stats Update
            const speedKmh = Math.round(currentSpeed * 110);
            document.getElementById('speed-val').innerText = speedKmh;
            document.getElementById('alt-val').innerText = Math.round(player.position.y);

            const distToRunway = Math.round(player.position.distanceTo(RUNWAY_POS));
            document.getElementById('runway-dist').innerText = distToRunway;

            // --- Touchdown & Crash Detection ---
            const dx = Math.abs(player.position.x - RUNWAY_POS.x);
            const dz = Math.abs(player.position.z - RUNWAY_POS.z);
            const groundHeight = getTerrainHeightAt(player.position.x, player.position.z);

            // On Runway Runway Corridor
            if (dx < RUNWAY_WIDTH / 2 + 4 && dz < RUNWAY_LENGTH / 2) {
                const runwaySurfaceY = RUNWAY_ALT + 1.8;

                if (player.position.y <= runwaySurfaceY + 1.0) {
                    const pitchAngle = Math.abs(player.rotation.x);
                    const rollAngle = Math.abs(player.rotation.z);

                    // Touchdown Speed & Angle Checks
                    if (speedKmh <= 150 && rollAngle < 0.35 && pitchAngle < 0.35) {
                        if (!isLanded) {
                            isLanded = true;
                            score += 1000;
                            document.getElementById('score-val').innerText = score;
                            document.getElementById('runway-status').innerText = "Touchdown! Rolling to a stop...";
                            document.getElementById('runway-status').style.color = "#34d399";
                        }
                        player.position.y = runwaySurfaceY;
                    } else {
                        endGame(false, `Hard Landing! Came in too fast (${speedKmh} km/h) or steep!`);
                    }
                }
            } else {
                // Crash into regular terrain or ocean
                if (player.position.y <= groundHeight + 1.5) {
                    endGame(false, player.position.y <= 2 ? "Crashed into the ocean!" : "Crashed into terrain!");
                }
            }

            renderer.render(scene, camera);
        }

        function endGame(won, message) {
            isGameOver = true;
            const modal = document.getElementById('game-over');
            const title = document.getElementById('over-title');
            const desc = document.getElementById('over-desc');

            if (won) {
                title.innerText = "MISSION COMPLETED!";
                title.style.color = "#34d399";
                desc.innerText = `${message} Score Bonus Awarded!`;
            } else {
                title.innerText = "CRASH LANDING!";
                title.style.color = "#f43f5e";
                desc.innerText = message;
            }

            document.getElementById('final-score').innerText = score;
            modal.style.display = 'block';
        }

        function resetGame() {
            document.getElementById('game-over').style.display = 'none';
            player.position.set(0, 140, 0);
            player.rotation.set(0, 0, 0);
            targetMouseX = 0; targetMouseY = 0;
            smoothMouseX = 0; smoothMouseY = 0;
            camera.position.set(0, 145, -22);
            score = 0;
            throttle = 1.2;
            isLanded = false;
            isGameOver = false;
            document.getElementById('score-val').innerText = score;
            document.getElementById('runway-status').innerText = "Collect rings or head straight to land!";
            document.getElementById('runway-status').style.color = "#94a3b8";
            spawnRings();
            animate();
        }

        // Run Game
        spawnRings();
        animate();
    </script>
</body>
</html>
