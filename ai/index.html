<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IDKManyAI</title>

<style>
* {
    box-sizing: border-box;
    font-family: Inter, Arial, sans-serif;
}

body {
    margin: 0;
    height: 100vh;
    display: flex;
    background: #09090f;
    color: white;
}

/* Sidebar */

#sidebar {
    width: 260px;
    background: rgba(20,20,30,0.9);
    border-right: 1px solid #333;
    padding: 20px;
}

.logo {
    font-size: 25px;
    font-weight: 800;
    margin-bottom: 25px;
}

.new-chat {
    width: 100%;
    padding: 12px;
    border-radius: 12px;
    border: none;
    background: #2563eb;
    color: white;
    cursor: pointer;
    font-weight: bold;
}

.chat-item {
    margin-top: 15px;
    padding: 10px;
    background: #191925;
    border-radius: 10px;
}


/* Main */

#main {
    flex: 1;
    display: flex;
    flex-direction: column;
}


header {
    padding: 18px;
    text-align: center;
    font-size: 24px;
    font-weight: bold;
    border-bottom: 1px solid #333;
    background: rgba(15,15,25,0.8);
}


#messages {
    flex: 1;
    overflow-y: auto;
    padding: 25px;
}


.message {
    max-width: 75%;
    padding: 14px 18px;
    margin: 12px 0;
    border-radius: 18px;
    white-space: pre-wrap;
    line-height: 1.5;
}


.user {
    margin-left: auto;
    background: #2563eb;
}


.ai {
    background: #1d1d29;
}


/* Input */

#input-area {
    display:flex;
    gap:10px;
    padding:18px;
    background:#11111b;
}


#input {
    flex:1;
    padding:15px;
    border-radius:14px;
    border:none;
    outline:none;
    background:#242435;
    color:white;
    font-size:16px;
}


#send {
    padding:15px 22px;
    border:none;
    border-radius:14px;
    background:#2563eb;
    color:white;
    font-weight:bold;
    cursor:pointer;
}


@media(max-width:700px){

    #sidebar {
        display:none;
    }

    .message {
        max-width:90%;
    }

}

</style>

</head>

<body>


<div id="sidebar">

<div class="logo">
🤖 IDKManyAI
</div>

<button class="new-chat" onclick="newChat()">
+ New Chat
</button>

<div class="chat-item">
Current Chat
</div>

</div>



<div id="main">


<header>
IDKManyAI
</header>


<div id="messages">

<div class="message ai">
Hello! I am IDKManyAI. :)
</div>

</div>



<div id="input-area">

<input 
id="input"
placeholder="Message IDKManyAI..."
autocomplete="off"
/>

<button id="send">
Send
</button>

</div>


</div>


<script>

const WORKER_URL =
"https://idkaiworker-beta.maxenozofficia.workers.dev";


const messages =
document.getElementById("messages");

const input =
document.getElementById("input");

const send =
document.getElementById("send");



function addMessage(text,type){

    const div =
    document.createElement("div");

    div.className =
    "message " + type;

    div.textContent =
    text;

    messages.appendChild(div);

    messages.scrollTop =
    messages.scrollHeight;
}



async function sendMessage(){

    const text =
    input.value.trim();

    if(!text) return;


    addMessage(text,"user");

    input.value="";


    const loading =
    document.createElement("div");

    loading.className="message ai";

    loading.textContent=
    "Generating response, please wait.";

    messages.appendChild(loading);


    try {

        const res =
        await fetch(
            WORKER_URL,
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    message:text
                })
            }
        );


        const data =
        await res.json();


        loading.remove();


        const reply =
        data.candidates?.[0]
        ?.content
        ?.parts?.[0]
        ?.text
        ||
        "No answer received.";


        addMessage(reply,"ai");


    } catch(err){

        loading.remove();

        addMessage(
            "Connection error: "+err.message,
            "ai"
        );

    }

}



send.onclick =
sendMessage;


input.addEventListener(
"keydown",
(e)=>{

    if(e.key==="Enter"){
        sendMessage();
    }

});



function newChat(){

    messages.innerHTML="";

    addMessage(
        "New IDKManyAI chat started.",
        "ai"
    );

}


</script>


</body>
</html>
