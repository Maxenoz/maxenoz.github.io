<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IDKManyAI</title>

<style>
* {
    box-sizing: border-box;
    font-family: Inter, Arial, sans-serif;
}

body {
    margin:0;
    height:100vh;
    display:flex;
    background:#09090f;
    color:white;
}


#sidebar {
    width:260px;
    background:#11111b;
    border-right:1px solid #333;
    padding:20px;
}


.logo {
    font-size:25px;
    font-weight:800;
    margin-bottom:25px;
}


.new-chat {
    width:100%;
    padding:12px;
    border-radius:12px;
    border:none;
    background:#2563eb;
    color:white;
    cursor:pointer;
}


.chat-item {
    margin-top:15px;
    padding:10px;
    background:#1b1b29;
    border-radius:10px;
}



#main {
    flex:1;
    display:flex;
    flex-direction:column;
}



header {
    padding:18px;
    text-align:center;
    font-size:24px;
    font-weight:bold;
    border-bottom:1px solid #333;
}



#model {
    margin-left:15px;
    padding:8px 12px;
    border-radius:10px;
    background:#242435;
    color:white;
    border:1px solid #444;
}



#messages {
    flex:1;
    overflow-y:auto;
    padding:25px;
}



.message {
    max-width:75%;
    padding:14px 18px;
    margin:12px 0;
    border-radius:18px;
    white-space:pre-wrap;
}



.user {
    margin-left:auto;
    background:#2563eb;
}



.ai {
    background:#1d1d29;
}



#input-area {
    display:flex;
    gap:10px;
    padding:18px;
    background:#11111b;
}



#input {
    flex:1;
    padding:15px;
    border:none;
    border-radius:14px;
    background:#242435;
    color:white;
    outline:none;
}



#send {
    padding:15px 22px;
    border:none;
    border-radius:14px;
    background:#2563eb;
    color:white;
    cursor:pointer;
}



@media(max-width:700px){

    #sidebar {
        display:none;
    }

}
</style>

</head>


<body>


<div id="sidebar">

<div class="logo">
IDKManyAI
</div>


<button class="new-chat" onclick="newChat()">
+ New Chat
</button>


<div class="chat-item">
Current session
</div>


</div>



<div id="main">


<header>

IDKManyAI — ИИ-эксперимент :)

<select id="model">

<option value="gemini">
Gemini 3.6 Flash
</option>

<option value="gemma">
Gemma 4 31B
</option>

</select>

</header>



<div id="messages">

<div class="message ai">
IDKManyAI system online.
</div>

</div>



<div id="input-area">

<input 
id="input"
placeholder="Message IDKManyAI..."
>


<button id="send">
Send
</button>


</div>


</div>



<script>


const WORKER_URL =
"https://idkaiworker-beta.maxenozofficia.workers.dev";



const messages =
document.getElementById("messages");


const input =
document.getElementById("input");


const send =
document.getElementById("send");


const model =
document.getElementById("model");



function addMessage(text,type){

    const div=document.createElement("div");

    div.className="message "+type;

    div.textContent=text;

    messages.appendChild(div);

    messages.scrollTop=
    messages.scrollHeight;

}



async function sendMessage(){

    const text=input.value.trim();

    if(!text) return;


    addMessage(text,"user");

    input.value="";


    const loading=document.createElement("div");

    loading.className="message ai";

    loading.textContent=
    "Generating response...";


    messages.appendChild(loading);



    try {


        const res = await fetch(
            WORKER_URL,
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({

                    message:text,

                    model:model.value

                })

            }
        );



        const data =
        await res.json();


        loading.remove();



        let reply;



        // Gemini format

        if(model.value==="gemini"){

            reply =
            data.candidates?.[0]
            ?.content
            ?.parts?.[0]
            ?.text;

        }



        // OpenRouter format

        if(model.value==="gemma"){

            reply =
            data.choices?.[0]
            ?.message
            ?.content;

        }



        if(reply){

            addMessage(
                reply,
                "ai"
            );

        }


        else {

            addMessage(
                "API response:\n\n"+
                JSON.stringify(
                    data,
                    null,
                    2
                ),
                "ai"
            );

        }



    }


    catch(error){


        loading.remove();


        addMessage(
            "Connection error:\n"+
            error.message,
            "ai"
        );


    }


}



send.onclick=
sendMessage;



input.addEventListener(
"keydown",
e=>{

    if(e.key==="Enter"){

        sendMessage();

    }

});



function newChat(){

    messages.innerHTML="";


    addMessage(
        "New session started.",
        "ai"
    );

}


</script>


</body>
</html>
